spring:
  application:
    name: risk-management-system


  datasource:
    url: jdbc:postgresql://localhost:5432/risk_management
    username: postgres
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
app:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    employee-id: ${BOOTSTRAP_ADMIN_EMPLOYEE_ID:}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
external-api:
  alpha-vantage:
    api-key: ${ALPHAVANTAGE_API_KEY}