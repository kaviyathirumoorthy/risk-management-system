spring:
  application:
    name: risk-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/risk_management
    username: postgres
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
