name: Java Build and Integration Test

on:
  push:
    branches:
      - main
      - setup/project-initialization

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: risk_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d risk_management"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw clean verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/risk_management
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: risk-management-system-jar
          path: target/*.jar
